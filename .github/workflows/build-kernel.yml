name: Build Android Kernel (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出内核源码
        run: |
          cd $HOME
          git clone https://github.com/kmerc224/kernel_xiaomi_raphael_Helium.git -b oss-base --depth=1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip openjdk-8-jdk language-pack-zh-hans python2 python3 cpio p7zip-full libyaml-dev
          sudo apt-get install gcc-aarch64-linux-gnu
          sudo apt-get install gcc-arm*

      - name: 获取工具链
        run: |
          cd $HOME
          mkdir llvm19
          cd llvm19
          wget https://github.com/Mandi-Sa/clang/releases/download/amd64-full-toolchain-19/llvm19.0.0-binutils2.42.50_amd64-full-toolchain_20240301.7z
          7z x llvm19.0.0-binutils2.42.50_amd64-full-toolchain_20240301.7z

      - name: 编译内核
        run: |
          cd $HOME/kernel_xiaomi_raphael_Helium
          export CC=clang
          export ARCH=arm64
          export PATH="$HOME/llvm19/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make O=out raphael_defconfig
          make O=out -j16

      - name: 打包产物
        run: |
          cd $HOME/kernel_xiaomi_raphael_Helium/out/arch/arm64
          zip -r boot-images.zip boot
      
      - name: 上传artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-images.zip
          path: $HOME/kernel_xiaomi_raphael_Helium/out/arch/arm64/boot-images.zip

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kernel Build ${{ github.run_number }}
          files: |
            $HOME/kernel_xiaomi_raphael_Helium/out/arch/arm64/boot-images.zip
            $HOME/kernel_xiaomi_raphael_Helium/out/arch/arm64/boot/Image*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}